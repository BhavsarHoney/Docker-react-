
name: Node.js CI and Docker CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-and-push:
    needs: test
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Verify Buildah prerequisites
        run: |
         echo "Node: $HOSTNAME"
         cat /proc/sys/user/max_user_namespaces
         unshare -Ur true
         echo "User namespace creation succeeded"
 
      
      
      - name: Install Buildah
        run: |
          set -eu

          if ! command -v buildah >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y buildah
          fi

          buildah --version

      - name: Check Buildah environment
        run: |
          set -eu
          id
          echo "User namespace limit:"
          cat /proc/sys/user/max_user_namespaces

      
      - name: Diagnose Buildah namespace restrictions
        run: |
         echo "=== User namespace limit ==="
         cat /proc/sys/user/max_user_namespaces

         echo "=== Current user namespace ==="
         readlink /proc/self/ns/user

         echo "=== User namespace creation test ==="
         unshare -Ur true || true

         echo "=== Seccomp mode ==="
         grep '^Seccomp:' /proc/self/status

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu

          printf '%s' "$DOCKERHUB_TOKEN" | buildah \
            --storage-driver vfs \
            login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin docker.io

      - name: Build Docker image using Buildah
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BUILDAH_ISOLATION: chroot
        run: |
          set -eu

          buildah \
            --storage-driver vfs \
            bud \
            --isolation chroot \
            --format docker \
            --file ./Dockerfile \
            --tag "docker.io/${DOCKERHUB_USERNAME}/react-app:latest" \
            --tag "docker.io/${DOCKERHUB_USERNAME}/react-app:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu

          buildah --storage-driver vfs push \
            "docker.io/${DOCKERHUB_USERNAME}/react-app:latest"

          buildah --storage-driver vfs push \
            "docker.io/${DOCKERHUB_USERNAME}/react-app:${GITHUB_SHA}"

      - name: Log out from Docker Hub
        if: always()
        run: buildah logout docker.io