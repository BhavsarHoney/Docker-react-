
name: Node.js CI and Docker CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-and-push:
    needs: test
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Buildah prerequisites
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Runner hostname ==="
          echo "$HOSTNAME"

          echo "=== User namespace limit ==="
          cat /proc/sys/user/max_user_namespaces

          echo "=== User namespace creation test ==="
          unshare -Ur true

          echo "User namespace creation succeeded"

      - name: Install Buildah
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v buildah >/dev/null 2>&1; then
            sudo -n apt-get update
            sudo -n apt-get install -y buildah uidmap
          fi

          buildah --version

      - name: Diagnose Buildah environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Runner identity ==="
          id

          echo "=== User namespace limit ==="
          cat /proc/sys/user/max_user_namespaces

          echo "=== Current user namespace ==="
          readlink /proc/self/ns/user

          echo "=== Seccomp mode ==="
          grep '^Seccomp:' /proc/self/status

          echo "=== UID/GID mappings ==="
          buildah unshare cat /proc/self/uid_map || true
          buildah unshare cat /proc/self/gid_map || true

      - name: Configure Buildah single-UID VFS storage
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/containers"
          mkdir -p "$HOME/.local/share/containers/storage"
          mkdir -p "/tmp/containers-run-$(id -u)"

          cat > "$HOME/.config/containers/storage.conf" <<EOF
          [storage]
          driver = "vfs"
          runroot = "/tmp/containers-run-$(id -u)"
          graphroot = "$HOME/.local/share/containers/storage"

          [storage.options.vfs]
          ignore_chown_errors = "true"
          EOF

          echo "=== Buildah storage configuration ==="
          cat "$HOME/.config/containers/storage.conf"

          echo "=== Buildah information ==="
          buildah info

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "Docker Hub credentials are missing."
            exit 1
          fi

          printf '%s' "$DOCKERHUB_TOKEN" |
            buildah login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin \
              docker.io

      - name: Build Docker image using Buildah
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          BUILDAH_ISOLATION: chroot
        shell: bash
        run: |
          set -euo pipefail

          buildah bud \
            --isolation chroot \
            --format docker \
            --file ./Dockerfile \
            --tag "docker.io/${DOCKERHUB_USERNAME}/react-app:latest" \
            --tag "docker.io/${DOCKERHUB_USERNAME}/react-app:${GITHUB_SHA}" \
            .

      - name: Push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail

          buildah push \
            "docker.io/${DOCKERHUB_USERNAME}/react-app:latest"

          buildah push \
            "docker.io/${DOCKERHUB_USERNAME}/react-app:${GITHUB_SHA}"

      - name: Log out from Docker Hub
        if: always()
        shell: bash
        run: |
          buildah logout docker.io || true