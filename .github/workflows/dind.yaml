
name: Node.js CI and Docker CD

on:
  workflow_dispatch:
  # Uncomment to trigger automatically on pushes to main
  # push:
  #   branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node.js Tests
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Verify that the runner can communicate with DinD
      - name: Verify Docker daemon
        run: |
          docker version
          docker info

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Authenticate with Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hanibhavsar/react-app:latest
            hanibhavsar/react-app:${{ github.sha }}
          cache-from: type=gha,scope=react-app
          cache-to: type=gha,mode=max,scope=react-app