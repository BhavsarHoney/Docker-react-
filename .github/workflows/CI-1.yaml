name: Node.js CI and Docker CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

  build-and-push:
    needs: test
    runs-on: company-eks-runners

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to Docker Hub first so the Buildx driver can access credentials natively
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # # Automatically sets up QEMU for multi-platform builds if needed
      # - name: Set up QEMU (Binfmt Multi-platform)
      #   uses: tonistiigi/binfmt-action@v3
      #   with:
      #     platforms: all

      # Configures Buildx to use the Kubernetes driver instead of looking for a local Docker daemon
      - name: Set up Docker Buildx (Kubernetes Driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: kubernetes

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }}
          # Leverages GitHub Actions cache backend to speed up builds on ARC
          cache-from: type=gha
          cache-to: type=gha,mode=max
