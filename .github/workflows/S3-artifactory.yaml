name: React CI and Artifact Release

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read

concurrency:
  group: react-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  DOCKER_IMAGE: hanibhavsar/react-app

jobs:
  test:
    name: Test React Application
    runs-on: company-eks-runners

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      # - name: Check dependency vulnerabilities
      #   run: npm audit --audit-level=high

  build-and-publish:
    name: Build and Publish Release
    needs: test
    runs-on: company-eks-runners

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # - name: Set up Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d build
          test -n "$(find build -type f -print -quit)"
          du -sh build  

      - name: Package compiled frontend
        run: |
          set -euo pipefail
          mkdir -p release
          zip -qr "release/react-app-${GITHUB_SHA}.zip" build
          cd release
          sha256sum "react-app-${GITHUB_SHA}.zip" \
            > "react-app-${GITHUB_SHA}.zip.sha256"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload release artifacts to private S3
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_BUCKET"

          PREFIX="releases/${GITHUB_SHA}/frontend"

          aws s3 cp \
            "release/react-app-${GITHUB_SHA}.zip" \
            "s3://${ARTIFACT_BUCKET}/${PREFIX}/react-app-${GITHUB_SHA}.zip" \
            --sse AES256

          aws s3 cp \
            "release/react-app-${GITHUB_SHA}.zip.sha256" \
            "s3://${ARTIFACT_BUCKET}/${PREFIX}/react-app-${GITHUB_SHA}.zip.sha256" \
            --sse AES256

          echo "## Frontend release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- S3 bucket: ${ARTIFACT_BUCKET}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: ${PREFIX}/react-app-${GITHUB_SHA}.zip" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "- Checksum: ${PREFIX}/react-app-${GITHUB_SHA}.zip.sha256" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Docker daemon
        run: docker info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image tags
        id: image-tags
        shell: bash
        run: |
          {
            echo "tags<<EOF"
            echo "${DOCKER_IMAGE}:${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "${DOCKER_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha,scope=react-app
          cache-to: type=gha,mode=max,scope=react-app

      - name: Print summary
        run: |
          {
            echo "## Release published"
            echo "- Git commit: ${GITHUB_SHA}"
            echo "- Docker image: ${DOCKER_IMAGE}:${GITHUB_SHA}"
            echo "- Frontend artifact: releases/${GITHUB_SHA}/frontend/"
          } >> "$GITHUB_STEP_SUMMARY"